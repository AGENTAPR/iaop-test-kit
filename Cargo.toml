[workspace]
resolver = "3"
members = ["crates/iaop-test-kit"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
